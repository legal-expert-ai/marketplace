name: Validate plugin

on:
  pull_request:
  push:
    branches: [main, stable]
    tags: ["installer-v*"]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate bundle
        run: python plugins/legal-expert/scripts/validate_plugin_bundle.py
      - name: Run tests
        run: python -m unittest discover -s plugins/legal-expert/tests -v
      - name: Test Windows installer bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/windows/Test-Installer.ps1

  build-windows-installer:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\LegalExpert.iss
          $hash = (Get-FileHash dist\LegalExpertSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LegalExpertSetup.exe" | Set-Content dist\LegalExpertSetup.exe.sha256 -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: LegalExpertSetup
          path: |
            dist/LegalExpertSetup.exe
            dist/LegalExpertSetup.exe.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/installer-v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/LegalExpertSetup.exe#LegalExpertSetup.exe" `
            "dist/LegalExpertSetup.exe.sha256#LegalExpertSetup.exe.sha256" `
            --verify-tag `
            --title "Legal Expert Windows Installer $env:GITHUB_REF_NAME" `
            --generate-notes
