name: Validate plugin

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate bundle
        run: python plugins/legal-expert/scripts/validate_plugin_bundle.py
      - name: Run tests
        run: python -m unittest discover -s plugins/legal-expert/tests -v
