name: Validate plugin

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate bundle
        run: python plugins/legal-expert/scripts/validate_plugin_bundle.py
      - name: Run tests
        run: python -m unittest discover -s plugins/legal-expert/tests -v
      - name: Test Windows installer bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/windows/Test-Installer.ps1

  compile-windows-installer:
    name: Compile Windows installer
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Compile installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\LegalExpert.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath "dist\LegalExpertSetup.exe" -PathType Leaf)) {
            throw "Inno Setup did not create dist\LegalExpertSetup.exe."
          }
